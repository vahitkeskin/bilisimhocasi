  <line x1="112" y1="105" x2="112" y2="140" stroke="#BDBDBD" stroke-width="4"/>
  <!-- Cylindrical Body -->
  <circle cx="100" cy="65" r="45" fill="#212121" stroke="#424242" stroke-width="2"/>
  <circle cx="100" cy="65" r="40" fill="#303030"/>
